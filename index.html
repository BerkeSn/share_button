    <link rel="stylesheet" href="style.css">

    <div class="socials-wrapper">

                <a href="#"></a>

            </li>
            <li class="social" title="Linkedin">
                <a href="#"></a>
                <img src="assets/linkedin.svg" alt="">

            <li class="social" title="Twitter">

            </li>

</html>
